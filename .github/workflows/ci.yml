name: CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'libs/**'
      - 'mcp-server/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'Dockerfile'
      - '.env.example'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'libs/**'
      - 'mcp-server/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'Dockerfile'
      - '.env.example'
      - 'scripts/**'
      - '.github/workflows/ci.yml'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run checks and tests
        run: ./gradlew check --no-daemon

      - name: Verify Docker build
        run: docker build -t luna:ci-test .
